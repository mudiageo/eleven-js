packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  tailwind-variants: ^3.2.2
  tw-animate-css: ^1.4.0
  shadcn-svelte: ^1.2.7
  "@lucide/svelte": ^1.14.0
  "@fontsource-variable/oxanium": ^5.2.8
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
